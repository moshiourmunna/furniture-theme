# Local stack for development / demo.  `docker compose up -d mysql` is enough for `pnpm dev`.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shekor
      MYSQL_USER: shekor
      MYSQL_PASSWORD: shekor_dev_pw
      MYSQL_ROOT_PASSWORD: root_dev_pw
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql, ./docker/mysql-init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev_pw"]
      interval: 5s
      retries: 20
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    profiles: ["full"]
    depends_on: { mysql: { condition: service_healthy } }
    environment:
      DATABASE_URL: mysql://shekor:shekor_dev_pw@mysql:3306/shekor
      APP_URL: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:5173
      SESSION_SECRET: please-change-this-session-secret-in-production
    ports: ["3000:3000"]
    volumes: [uploads:/app/apps/web/storage/uploads]
  admin:
    build: { context: ., dockerfile: docker/admin.Dockerfile }
    profiles: ["full"]
    depends_on: [web]
    ports: ["5173:80"]
volumes:
  mysql-data:
  uploads:
