<!doctype html>
<html lang="en" class="admin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#14231C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Shekor Admin</title>
    <script>
      (function () { try { var t = localStorage.getItem('shekor-admin-theme'); var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; if (d) document.documentElement.classList.add('dark'); var l = localStorage.getItem('shekor-admin-lang'); if (l === 'bn') { document.documentElement.lang = 'bn'; document.documentElement.classList.add('lang-bn'); } } catch (e) {} })();
    </script>
  </head>
  <body class="bg-bg text-ink font-sans antialiased">
    <a href="#main" class="skip-link">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
