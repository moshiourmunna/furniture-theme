name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

env:
  DATABASE_URL: mysql://shekor:shekor_dev_pw@127.0.0.1:3306/shekor
  TEST_DATABASE_URL: mysql://shekor:shekor_dev_pw@127.0.0.1:3306/shekor_test
  APP_URL: http://localhost:3000
  ADMIN_ORIGIN: http://localhost:5173
  SESSION_SECRET: ci-only-session-secret-0123456789abcdef
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_DATABASE: shekor, MYSQL_USER: shekor, MYSQL_PASSWORD: shekor_dev_pw, MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.6 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: mysql -h 127.0.0.1 -uroot -proot < docker/mysql-init/01-test-db.sql
      - run: cp .env.example .env
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (real MySQL)
        run: pnpm test:integration
      - run: pnpm build
      - name: Start apps
        run: |
          (cd apps/web && DISABLE_RATE_LIMIT=1 EXPOSE_DEV_OTP=1 PORT=3000 pnpm start > /tmp/web.log 2>&1 &)
          (cd apps/admin && npx vite preview --port 5173 --strictPort > /tmp/admin.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:3000/api/v1/health http://localhost:5173/login
      - run: pnpm --filter @shekor/e2e exec playwright install --with-deps chromium firefox webkit
      - name: E2E flows (Chromium, Firefox, WebKit)
        run: pnpm --filter @shekor/e2e e2e
      - name: Browser pass (all engines × sizes × EN/BN × light/dark)
        run: pnpm --filter @shekor/e2e browser-pass
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-reports, path: tests/e2e/reports, retention-days: 7 }
