components:
  securitySchemes:
    storeSession:
      type: apiKey
      in: cookie
      name: shekor_sid
    adminSession:
      type: apiKey
      in: cookie
      name: shekor_admin
  parameters:
    Csrf:
      name: x-csrf-token
      in: header
      required: true
      schema:
        type: string
      description: Must equal the shekor_csrf cookie (GET /api/v1/auth/csrf issues one).
  responses:
    Error:
      description: Error
      content:
        "application/json":
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
    ValidationError:
      description: Validation failed
      content:
        "application/json":
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    const: validation
                  message:
                    type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: string
  schemas:
    addressSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        label:
          default: Home
          type: string
          maxLength: 40
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
        division:
          type: string
          minLength: 2
          maxLength: 40
        district:
          type: string
          minLength: 2
          maxLength: 60
        area:
          type: string
          minLength: 2
          maxLength: 120
        line1:
          type: string
          minLength: 4
          maxLength: 255
        isDefault:
          default: false
          type: boolean
      required:
        - name
        - phone
        - division
        - district
        - area
        - line1
    changePasswordSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          allOf:
            - pattern: "[A-Za-z]"
            - pattern: "\\d"
      required:
        - currentPassword
        - newPassword
    profileSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          anyOf:
            - type: string
            - type: string
              const: ""
        locale:
          type: string
          enum:
            - en
            - bn
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        marketingOptIn:
          type: boolean
      required:
        - name
    loginSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        identifier:
          type: string
          minLength: 3
          maxLength: 191
        password:
          type: string
          minLength: 1
          maxLength: 72
      required:
        - identifier
        - password
    otpRequestSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        target:
          type: string
          minLength: 3
          maxLength: 191
        purpose:
          type: string
          enum:
            - login
            - verify
            - reset
      required:
        - target
        - purpose
    otpVerifySchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        target:
          type: string
          minLength: 3
          maxLength: 191
        purpose:
          type: string
          enum:
            - login
            - verify
            - reset
        code:
          type: string
          pattern: "^\\d{6}$"
      required:
        - target
        - purpose
        - code
    resetPasswordSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        target:
          type: string
          minLength: 3
          maxLength: 191
        code:
          type: string
          pattern: "^\\d{6}$"
        password:
          type: string
          minLength: 8
          maxLength: 72
          allOf:
            - pattern: "[A-Za-z]"
            - pattern: "\\d"
      required:
        - target
        - code
        - password
    registerSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          anyOf:
            - type: string
            - type: string
              const: ""
        phone:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
          allOf:
            - pattern: "[A-Za-z]"
            - pattern: "\\d"
        marketingOptIn:
          default: false
          type: boolean
      required:
        - name
        - phone
        - password
    quoteRequestSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
                exclusiveMinimum: 0
                maximum: 9007199254740991
              variantId:
                anyOf:
                  - type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  - type: "null"
              qty:
                type: integer
                minimum: 1
                maximum: 20
            required:
              - productId
              - qty
        couponCode:
          type: string
          maxLength: 40
        division:
          type: string
        district:
          type: string
        assembly:
          default: true
          type: boolean
        paymentMethod:
          default: bkash
          type: string
          enum:
            - bkash
            - nagad
            - card
            - cod
            - bank
        paymentPlan:
          default: full
          type: string
          enum:
            - full
            - advance
        advancePercent:
          type: integer
          minimum: 20
          maximum: 50
      required:
        - items
    checkoutSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
                exclusiveMinimum: 0
                maximum: 9007199254740991
              variantId:
                anyOf:
                  - type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  - type: "null"
              qty:
                type: integer
                minimum: 1
                maximum: 20
            required:
              - productId
              - qty
        customer:
          type: object
          properties:
            name:
              type: string
              minLength: 2
              maxLength: 120
            phone:
              type: string
            email:
              anyOf:
                - type: string
                - type: string
                  const: ""
          required:
            - name
            - phone
        address:
          type: object
          properties:
            division:
              type: string
              minLength: 2
              maxLength: 40
            district:
              type: string
              minLength: 2
              maxLength: 60
            area:
              type: string
              minLength: 2
              maxLength: 120
            line1:
              type: string
              minLength: 4
              maxLength: 255
          required:
            - division
            - district
            - area
            - line1
        deliveryDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        deliverySlot:
          type: string
          enum:
            - morning
            - afternoon
            - evening
        assembly:
          default: true
          type: boolean
        paymentMethod:
          type: string
          enum:
            - bkash
            - nagad
            - card
            - cod
            - bank
        paymentPlan:
          default: full
          type: string
          enum:
            - full
            - advance
        advancePercent:
          type: integer
          minimum: 20
          maximum: 50
        couponCode:
          type: string
          maxLength: 40
        notes:
          type: string
          maxLength: 500
        saveAddress:
          type: boolean
        locale:
          default: en
          type: string
          enum:
            - en
            - bn
        acceptTerms:
          type: boolean
          const: true
      required:
        - items
        - customer
        - address
        - deliveryDate
        - deliverySlot
        - paymentMethod
        - acceptTerms
    customOrderSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
        email:
          anyOf:
            - type: string
            - type: string
              const: ""
        city:
          type: string
          maxLength: 60
        pieceType:
          type: string
          minLength: 2
          maxLength: 80
        material:
          type: string
          maxLength: 60
        dimensions:
          type: string
          maxLength: 120
        budget:
          type: string
          maxLength: 60
        details:
          type: string
          minLength: 10
          maxLength: 4000
      required:
        - name
        - phone
        - pieceType
        - details
    reviewSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
